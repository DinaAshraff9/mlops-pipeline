version: "3.9"

networks:
  mlops-net:
    driver: bridge

volumes:
  mlflow-data:
  prometheus-data:
  grafana-data:
  postgres-data:
  model-artifacts:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlops1234}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [mlops-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "pip install psycopg2-binary --quiet && mlflow server --backend-store-uri postgresql://mlflow:${POSTGRES_PASSWORD:-mlops1234}@postgres:5432/mlflow --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000"
    volumes:
      - mlflow-data:/mlflow/artifacts
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [mlops-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  trainer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.trainer
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: mlops-pipeline
      MODEL_NAME: fraud-detector
      DATA_PATH: /app/data/dataset.csv
      MODEL_OUTPUT_DIR: /app/model/artifacts
      OPTUNA_TRIALS: "20"
    volumes:
      - model-artifacts:/app/model/artifacts
      - ../data:/app/data
    depends_on:
      mlflow:
        condition: service_healthy
    networks: [mlops-net]
    profiles: ["train"]

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_OUTPUT_DIR: /app/model/artifacts
      MODEL_NAME: fraud-detector
      API_TOKEN: ${API_TOKEN:-mlops-secret-token}
      MODEL_VERSION: "1.0.0"
    volumes:
      - model-artifacts:/app/model/artifacts
    ports:
      - "8000:8000"
    depends_on:
      mlflow:
        condition: service_healthy
    networks: [mlops-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.52.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [mlops-net]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus]
    networks: [mlops-net]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    volumes:
      - ../monitoring/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    networks: [mlops-net]
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
    ports:
      - "9200:9200"
    networks: [mlops-net]
    profiles: ["logging"]
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on: [elasticsearch]
    networks: [mlops-net]
    profiles: ["logging"]
    restart: unless-stopped