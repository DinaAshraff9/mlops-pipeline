# NOTE: In production, use AWS Secrets Manager or HashiCorp Vault
# Never commit real secret values to Git!
# Use: kubectl create secret generic mlops-secrets --from-env-file=.env.production

apiVersion: v1
kind: Secret
metadata:
  name: mlops-secrets
  namespace: mlops
type: Opaque
stringData:
  api-token:      "REPLACE_WITH_REAL_TOKEN"
  mlflow-db-uri:  "postgresql://mlflow:PASSWORD@rds-host:5432/mlflow"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlops-api-sa
  namespace: mlops
  annotations:
    # AWS IRSA — allows pod to assume IAM role without static credentials
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/mlops-api-role"
