apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops
  labels:
    app: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.13.0
          command:
            - mlflow
            - server
            - "--backend-store-uri"
            - "$(MLFLOW_BACKEND_URI)"
            - "--default-artifact-root"
            - "s3://$(S3_BUCKET)/mlflow-artifacts"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "5000"
          env:
            - name: MLFLOW_BACKEND_URI
              valueFrom:
                secretKeyRef:
                  name: mlops-secrets
                  key: mlflow-db-uri
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: mlops-config
                  key: s3_bucket
            - name: AWS_DEFAULT_REGION
              valueFrom:
                configMapKeyRef:
                  name: mlops-config
                  key: aws_region
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu:    "250m"
              memory: "512Mi"
            limits:
              cpu:    "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-service
  namespace: mlops
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mlops-config
  namespace: mlops
data:
  model_version:  "1.0.0"
  s3_bucket:      "mlops-artifacts-bucket"
  aws_region:     "us-east-1"
  environment:    "production"
