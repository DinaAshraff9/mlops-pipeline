apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-api
  namespace: mlops
  labels:
    app: mlops-api
    version: "1.0.0"
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mlops-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0      # Zero downtime
      maxSurge: 1
  template:
    metadata:
      labels:
        app: mlops-api
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8000"
        prometheus.io/path:   "/metrics"
    spec:
      serviceAccountName: mlops-api-sa

      # Pod anti-affinity: spread replicas across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [mlops-api]
                topologyKey: kubernetes.io/hostname

      containers:
        - name: api
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/mlops-api:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http

          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow-service.mlops.svc.cluster.local:5000"
            - name: MODEL_OUTPUT_DIR
              value: "/app/model/artifacts"
            - name: MODEL_VERSION
              valueFrom:
                configMapKeyRef:
                  name: mlops-config
                  key: model_version
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mlops-secrets
                  key: api-token

          resources:
            requests:
              cpu:    "250m"
              memory: "512Mi"
            limits:
              cpu:    "1000m"
              memory: "1Gi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds:       15
            failureThreshold:    3

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds:       10
            failureThreshold:    3

          volumeMounts:
            - name: model-artifacts
              mountPath: /app/model/artifacts
              readOnly: true

      volumes:
        - name: model-artifacts
          persistentVolumeClaim:
            claimName: model-artifacts-pvc

      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: mlops-api-service
  namespace: mlops
  labels:
    app: mlops-api
spec:
  selector:
    app: mlops-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mlops-api-ingress
  namespace: mlops
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-burst-multiplier: "5"
spec:
  tls:
    - hosts:
        - api.mlops.yourdomain.com
      secretName: mlops-api-tls
  rules:
    - host: api.mlops.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mlops-api-service
                port:
                  number: 80
