name: MLOps CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_retrain:
        description: 'Force model retraining'
        type: boolean
        default: false

env:
  AWS_REGION:       us-east-1
  ECR_API_REPO:     mlops-pipeline-api
  ECR_TRAINER_REPO: mlops-pipeline-trainer
  K8S_NAMESPACE:    mlops
  PYTHON_VERSION:   "3.11"

jobs:
  # ─────────────────────────────────────────────────────────
  # 1. Code Quality & Tests
  # ─────────────────────────────────────────────────────────
  test:
    name: 🧪 Tests & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest pytest-cov flake8 black isort mypy

      - name: Lint with flake8
        run: flake8 . --max-line-length=100 --exclude=.git,__pycache__,terraform

      - name: Format check with black
        run: black --check --line-length 100 .

      - name: Import order check
        run: isort --check-only .

      - name: Run tests
        run: |
          pytest tests/ -v \
            --cov=api --cov=model \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}


  # ─────────────────────────────────────────────────────────
  # 2. Security Scan
  # ─────────────────────────────────────────────────────────
  security:
    name: 🔐 Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Bandit (Python security)
        run: |
          pip install bandit
          bandit -r api/ model/ -ll

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1


  # ─────────────────────────────────────────────────────────
  # 3. Build & Push Docker Images
  # ─────────────────────────────────────────────────────────
  build:
    name: 🐳 Build & Push Images
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_API_REPO }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push API image
        uses: docker/build-push-action@v5
        with:
          context:    .
          file:       docker/Dockerfile.api
          push:       true
          tags:       ${{ steps.meta.outputs.tags }}
          labels:     ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build & Push Trainer image
        uses: docker/build-push-action@v5
        with:
          context:    .
          file:       docker/Dockerfile.trainer
          push:       true
          tags:       ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_TRAINER_REPO }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref:  ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_API_REPO }}:${{ steps.meta.outputs.version }}
          severity:   CRITICAL
          exit-code:  1


  # ─────────────────────────────────────────────────────────
  # 4. Model Training
  # ─────────────────────────────────────────────────────────
  train:
    name: 🤖 Train Model
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.ref == 'refs/heads/main' &&
      (contains(github.event.head_commit.message, '[retrain]') ||
       github.event.inputs.force_retrain == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name mlops-pipeline-eks --region ${{ env.AWS_REGION }}

      - name: Run training job on Kubernetes
        run: |
          kubectl create job model-train-${{ github.run_number }} \
            --image=${{ secrets.ECR_REGISTRY }}/${{ env.ECR_TRAINER_REPO }}:${{ needs.build.outputs.image_tag }} \
            --namespace=${{ env.K8S_NAMESPACE }} \
            -- python -m model.train

          # Wait for job completion (up to 30 min)
          kubectl wait job/model-train-${{ github.run_number }} \
            --for=condition=complete \
            --timeout=1800s \
            --namespace=${{ env.K8S_NAMESPACE }}

      - name: Check model metrics
        run: |
          kubectl logs job/model-train-${{ github.run_number }} \
            --namespace=${{ env.K8S_NAMESPACE }}


  # ─────────────────────────────────────────────────────────
  # 5. Deploy to Kubernetes (Blue/Green)
  # ─────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name mlops-pipeline-eks --region ${{ env.AWS_REGION }}

      - name: Deploy to Kubernetes
        run: |
          IMAGE="${{ secrets.ECR_REGISTRY }}/${{ env.ECR_API_REPO }}:${{ needs.build.outputs.image_tag }}"

          # Update image in deployment
          kubectl set image deployment/mlops-api \
            api=$IMAGE \
            --namespace=${{ env.K8S_NAMESPACE }} \
            --record

          # Update config
          kubectl patch configmap mlops-config \
            --namespace=${{ env.K8S_NAMESPACE }} \
            --patch '{"data":{"model_version":"${{ needs.build.outputs.image_tag }}"}}'

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/mlops-api \
            --namespace=${{ env.K8S_NAMESPACE }} \
            --timeout=5m

      - name: Run smoke tests
        run: |
          API_URL=$(kubectl get ingress mlops-api-ingress \
            --namespace=${{ env.K8S_NAMESPACE }} \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

          curl -sf "http://${API_URL}/health" || exit 1
          echo "✅ Smoke test passed!"

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ MLOps API deployed successfully!\nVersion: `${{ needs.build.outputs.image_tag }}`\nBy: ${{ github.actor }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Rollback on failure
        if: failure()
        run: |
          kubectl rollout undo deployment/mlops-api \
            --namespace=${{ env.K8S_NAMESPACE }}
          echo "⚠️  Deployment failed — rolled back to previous version."
