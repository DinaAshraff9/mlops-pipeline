name: Data Drift Detection

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  AWS_REGION:    us-east-1
  K8S_NAMESPACE: mlops

jobs:
  detect-drift:
    name: 🔍 Detect Data Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r api/requirements.txt

      - name: Run drift detection
        id: drift
        run: |
          python -m model.evaluate
          echo "drift_detected=$?" >> $GITHUB_OUTPUT

      - name: Trigger retraining if drift detected
        if: steps.drift.outputs.drift_detected == '1'
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: ci-cd.yml
          inputs: '{"force_retrain": true}'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify on drift
        if: steps.drift.outputs.drift_detected == '1'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "⚠️  Data drift detected! Retraining pipeline triggered automatically."
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
